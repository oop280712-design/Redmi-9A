name: Run Cloud Phone Container

on:
  workflow_dispatch:

jobs:
  run-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run Redroid (Android Container)
        run: |
          sudo modprobe binder devices=binder,hwbinder,vndbinder
          sudo modprobe ashmem_linux
          docker run -d --privileged --name redroid \
            -p 5555:5555 \
            redroid/redroid:11.0.0-latest \
            androidboot.hardware=mt6765 ro.secure=0 ro.debuggable=1

      - name: Start Pinggy Tunnel for ADB & Stream
        run: |
          curl -sL https://pinggy.io/download/pinggy_linux_amd64 -o pinggy
          chmod +x pinggy
          ./pinggy -p 5555 &
          sleep infinity
